name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "PyJWT[crypto]>=2.8"

      - name: Syntax check
        run: |
          python -m py_compile bot_multy.py config.py check_stack.py
          python -m py_compile tcbot/*.py scripts/*.py

      - name: Run tests
        run: |
          for t in markup roles backoff channels localadmin sso outbox diagnostics metrics smoke; do
            echo "=== test_$t ==="
            python "scripts/test_$t.py"
          done
